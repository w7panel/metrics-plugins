apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-traffic-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-traffic-api
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-traffic-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metrics-traffic-api
subjects:
  - kind: ServiceAccount
    name: metrics-traffic-api
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-traffic-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: metrics-traffic-api}
  template:
    metadata:
      labels: {app: metrics-traffic-api}
    spec:
      serviceAccountName: metrics-traffic-api
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: LOGS_BASE_URL
              value: {{ .Values.logsBaseUrl | quote }}
            - name: METRICS_BASE_URL
              value: {{ .Values.metricsBaseUrl | quote }}
            - name: PANEL_API_URL
              value: {{ .Values.panelApiUrl | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-traffic
spec:
  selector: {app: metrics-traffic-api}
  ports:
    - port: 8080
      targetPort: 8080
